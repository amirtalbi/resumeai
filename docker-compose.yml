services:
  traefik:
    image: traefik:v3.1
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - app-network
    restart: unless-stopped

  # Frontend - Nuxt 3
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NUXT_PUBLIC_API_BASE=/api
      - NUXT_APP_BASE_URL=/cv-builder/
    depends_on:
      - backend
      - traefik
    networks:
      - app-network
    restart: unless-stopped

  # Backend - NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=resumeai
      - DATABASE_PASSWORD=resumeai_secret
      - DATABASE_NAME=resumeai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRATION=15m
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      - JWT_REFRESH_EXPIRATION=7d
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - OLLAMA_TIMEOUT_MS=300000
      - OLLAMA_NUM_PREDICT=1024
      - FRONTEND_URL=http://localhost,http://localhost:3000,http://91.165.223.157,http://91.165.223.157:3000
      - PORT=3001
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      traefik:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=resumeai
      - POSTGRES_PASSWORD=resumeai_secret
      - POSTGRES_DB=resumeai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Ollama - AI Local
  ollama:
    image: ollama/ollama:latest
    gpus: all
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  postgres-data:
  redis-data:
  ollama-data:

networks:
  app-network:
    driver: bridge
